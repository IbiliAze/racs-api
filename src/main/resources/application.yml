spring:
  application:
    name: racs

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    datatype:
      datetime:
        WRITE_DATES_AS_TIMESTAMPS: false

  jpa:
    hibernate:
      ddl-auto: none

  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 300 # 5 mins
    refreshTokenExpiration: 604800 # 7 days
    readerAccessTokenExpiration: 1209600000 # 14 days, if milliseconds
    refresh-cookie-secure: true

  profiles:
    active: dev

  data:
    web:
      pageable:
        max-page-size: 2500

server:
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: Cisco123!
    key-store-type: PKCS12
    key-alias: springboot

logging:
  level:
    org:
      flywaydb: DEBUG
      springframework:
        boot:
          autoconfigure:
            flyway: DEBUG

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
