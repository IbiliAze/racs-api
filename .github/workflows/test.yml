name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw test

  # Dependency gate, next to test; any deploy or publish job must need it. Maven
  # resolves the dependency tree the way the build does: the CycloneDX plugin,
  # configured by Boot's parent, writes the SBOM the jar carries to
  # target/classes/META-INF/sbom/application.cdx.json (test-scope libraries are
  # not in it, since they never ship). osv-scanner then checks it against OSV
  # and fails on any advisory that osv-scanner.toml does not list. The scanner
  # gets the checkout read-only and is pinned by digest, the same one as the
  # GitLab test:audit job and acs-api's scan:dependencies; bump the tag and the
  # digest together.
  audit:
    name: test:audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B -ntp generate-resources
      - run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/src:ro \
            ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa \
            scan source --config=/src/osv-scanner.toml \
            -L /src/target/classes/META-INF/sbom/application.cdx.json
