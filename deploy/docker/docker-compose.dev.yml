services:
  mysql:
    image: mysql:8.0
    container_name: racs-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: racs
      MYSQL_USER: racsuser
      MYSQL_PASSWORD: racspass
      MYSQL_ROOT_PASSWORD: rootpass
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-prootpass']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
