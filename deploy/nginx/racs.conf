server {
    listen 443 ssl;
    server_name racs.eightmile.co.uk;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    include conf.d/locations/*.locations;

    # Spring Boot API
    location /api/ {
        set $upstream racs-live:5000;
        proxy_pass http://$upstream;

        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        error_page 502 = @fallback;
    }

    # Swagger / OpenAPI, optional
    location /swagger-ui/ {
        set $upstream racs-live:5000;
        proxy_pass http://$upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v3/api-docs {
        set $upstream racs-live:5000;
        proxy_pass http://$upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Next.js frontend — served by its own nginx container (racs-ui repo).
    location / {
        set $upstream racs-ui-live:80;
        proxy_pass http://$upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        error_page 502 = @fallback;
    }

    location @fallback {
        root /var/www/html;
        index backup.html;
        try_files /backup.html =502;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

        internal;
    }
}
